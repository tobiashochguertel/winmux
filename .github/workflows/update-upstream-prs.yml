name: Update Upstream PR Catalog

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    name: Regenerate .github/UPSTREAM-PRS.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            .github/scripts/generate_upstream_prs.py
            .github/pr-catalog.yaml
          cache-suffix: "prs"

      - name: Generate catalog
        run: uv run --script .github/scripts/generate_upstream_prs.py --config .github/pr-catalog.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git add .github/UPSTREAM-PRS.md .github/pr-catalog.yaml
          if git diff --cached --quiet; then
            echo "No changes — catalog is up to date."
          else
            git commit -m "docs: update upstream PR catalog

          Auto-generated by update-upstream-prs workflow.
          See .github/scripts/generate_upstream_prs.py

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push
            echo "✅ Pushed updated catalog"
          fi
