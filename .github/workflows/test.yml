name: Tests

on:
  push:
    branches: [main, dev.patch]
  pull_request:

jobs:
  test:
    name: swift test + release build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Release build (warnings-as-errors)
        run: swift build -c release --product winmux -Xswiftc -warnings-as-errors